[project]
name = "raya-lucaria"
version = "0.1.0"
description = "Foundation-first open educational framework and commons"
requires-python = ">=3.10"
dependencies = [
  "raya-cli",
  "raya-schema",
  "raya-static",
]

[dependency-groups]
dev = [
  "playwright>=1.60.0",
  "pytest>=8.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/cli",
  "packages/schema",
  "packages/static",
]

[tool.uv.sources]
raya-cli = { workspace = true }
raya-schema = { workspace = true }
raya-static = { workspace = true }
