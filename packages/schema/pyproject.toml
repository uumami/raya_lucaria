[project]
name = "raya-schema"
version = "0.1.0"
description = "Raya Lucaria schemas and validation helpers"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.22",
  "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raya_schema"]

[tool.hatch.build.targets.wheel.force-include]
"src/raya_schema/schemas" = "raya_schema/schemas"
