[project]
name = "raya-cli"
version = "0.1.0"
description = "Raya Lucaria command-line interface"
requires-python = ">=3.10"
dependencies = [
  "raya-schema",
  "raya-static",
]

[project.scripts]
raya = "raya_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raya_cli"]
