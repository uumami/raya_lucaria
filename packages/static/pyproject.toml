[project]
name = "raya-static"
version = "0.1.0"
description = "Raya Lucaria Glintstone static artifact builder"
requires-python = ">=3.10"
dependencies = [
  "raya-schema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raya_static"]
