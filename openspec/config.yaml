schema: spec-driven

context: |
  Raya Lucaria is a foundation-first open educational framework and commons,
  not a SaaS product or hosted dependency. Current authority lives in
  docs/foundation/. Future OpenSpec artifacts must derive from those foundation
  decisions. Use docs/foundation/15_system_overview.md as the system map and
  docs/foundation/13_truth_surfaces.md as the authority map.

  Pedagogical quality and educational freedom are equal first principles. The
  framework must serve serious university-level learning while keeping courses,
  student work, schemas, artifacts, and application logic portable.

  Minimum requirements are floors, not ceilings. Proposals should identify the
  smallest useful contract first, then describe how pedagogy-driven capabilities
  can grow without breaking static usefulness, authority labels, or portability.

  Domain language is canonical. Use docs/foundation/14_domain_language.md as
  the naming authority:
  - Raya Lucaria: the whole academy, framework, and commons.
  - Glintstone: content engine and static course path.
  - Primeval Current: links, backlinks, wikilinks, and knowledge graph.
  - Glintstone Key: identity, authentication, registration, and trust.
  - Rennala: study, mastery, retrieval practice, and metacognition.
  - Debate Parlor: live classroom participation.
  - Sellen: learning and coding agents, AI tutor, BYOK/local workflows.
  - Graven School: collaboration, discussions, annotations, peer learning.

  Plain package names remain the filesystem default: cli, schema, static,
  graph, study, agents, collaboration, live, identity, core, web, and ui. Pair
  domain names with package names when that clarifies ownership.

  Preserve the static-only course path. Dynamic services are optional
  progressive enhancement. Provider choices are adapters at the edges, not the
  architecture. Git is a strong canonical review path, but GitHub access must
  not be required for everyday teaching and learning.

  Keep authority domains explicit: official canon, personal work, shared
  course material, generated drafts, backend state, and accepted changes.
  Agents inherit user authority and do not receive special trust.

  Study features grow from official learning objects toward personal and shared
  learning state. Rennala may later include review queues, spaced repetition,
  confidence ratings, mastery maps, and study planning, but the first contracts
  should make cards, quizzes, prompts, and retrieval hooks validate and build.

  Legacy material is historical reference. Salvage principles intentionally,
  define new contracts, and test against current specs. Do not reintroduce old
  source names, renderer stacks, generated JSON shapes, examples, or workflow
  assumptions unless a current foundation decision or regenerated spec accepts
  them.

rules:
  proposal:
    - Reference the foundation files that justify the change.
    - Use canonical Raya Lucaria domain names when describing capabilities.
    - State the minimum requirement and the intended growth path.
    - Separate static-first contracts from optional dynamic domains.
    - Name legacy assumptions being salvaged or rejected.
  specs:
    - Write testable requirements derived from foundation decisions.
    - Separate required baseline behavior from future or optional capabilities.
    - Preserve authority boundaries for official, personal, shared, generated, and accepted material.
    - Keep provider dependencies out of core contracts unless the provider is explicitly an adapter.
  design:
    - Map domain names to plain package boundaries when implementation structure matters.
    - Preserve static-only operation before adding backend, web UI, realtime, or agent features.
    - Show how new functionality can increase without invalidating current contracts.
    - Keep student work portable and exportable.
  tasks:
    - Start with schema, validation, fixture, CLI, and artifact contract tests when a change touches contracts.
    - Include real e2e/static-read-path tests when a change touches rendered HTML, browser-facing resources, deployment portability, or static site behavior.
    - Use representative fixture content for render/e2e tests; label it as fixture material and avoid letting examples become canonical pedagogy or architecture.
    - Keep examples minimal and labeled as fixtures, not pedagogy by accident.
    - Split dynamic domains into separate proposals after static contracts are stable.
