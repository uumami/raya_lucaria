schema: spec-driven

context: |
  Raya Lucaria is a foundation-first open educational framework and commons,
  not a SaaS product or hosted dependency. Current authority lives in
  docs/foundation/. Future OpenSpec artifacts must derive from those foundation
  decisions. Use docs/foundation/15_system_overview.md as the system map and
  docs/foundation/13_truth_surfaces.md as the authority map.

  Pedagogical quality and educational freedom are equal first principles. The
  framework must serve serious university-level learning while keeping courses,
  student work, schemas, artifacts, and application logic portable.

  Minimum requirements are floors, not ceilings. Proposals should identify the
  smallest useful contract first, then describe how pedagogy-driven capabilities
  can grow without breaking static usefulness, authority labels, or portability.

  Domain language is canonical. Use docs/foundation/14_domain_language.md as
  the naming authority:
  - Raya Lucaria: the whole academy, framework, and commons.
  - Glintstone: content engine and static course path.
  - Primeval Current: links, backlinks, wikilinks, and knowledge graph.
  - Glintstone Key: identity, authentication, registration, and trust.
  - Rennala: study, mastery, retrieval practice, and metacognition.
  - Debate Parlor: live classroom participation.
  - Sellen: learning and coding agents, AI tutor, BYOK/local workflows.
  - Graven School: collaboration, discussions, annotations, peer learning.

  Plain package names remain the filesystem default: cli, schema, static,
  graph, study, agents, collaboration, live, identity, core, web, and ui. Pair
  domain names with package names when that clarifies ownership.

  Preserve the static-only course path. Dynamic services are optional
  progressive enhancement. Provider choices are adapters at the edges, not the
  architecture. Git is a strong canonical review path, but GitHub access must
  not be required for everyday teaching and learning.

  Keep authority domains explicit: official canon, personal work, shared
  course material, generated drafts, backend state, and accepted changes.
  Agents inherit user authority and do not receive special trust.

  Documentation is a first-class explanatory surface for
  contributors/collaborators, professors, students, and agents. Role
  documentation must use separate English and Spanish role directories with
  index pages so each role can grow into multiple topics. Code, package names,
  commands, schema fields, file paths, domain names, and stable identifiers
  remain English.

  Study features grow from official learning objects toward personal and shared
  learning state. Rennala may later include review queues, spaced repetition,
  confidence ratings, mastery maps, and study planning, but the first contracts
  should make cards, quizzes, prompts, and retrieval hooks validate and build.

  Source ordering is a core Glintstone contract. Courses use convention-first
  ordered source trees, section index pages, compact frontmatter metadata, and
  stable `raya:<id>` references. Generated local/master indexes and navigation
  data are artifact output, not source truth. Order prefixes must not become
  stable identity, rendered URL authority, or future study/graph state keys.

  The canonical source-course shape is `source: course` with one ordered
  authored `course/` tree. Rendered pages, colocated `_official/` learning
  objects, colocated `_assets/`, drafts, and partials live under that tree.
  `_official/`, `_assets/`, `_drafts/`, `drafts/`, `_partials/`, and other
  support paths stay private and unrendered. Do not add source `content:`,
  root authored `official/`, or root authored `assets/` to new contracts,
  scaffolds, fixtures, or examples.

  Rendering and executable content must advance in phases using
  docs/foundation/17_rendering_execution_plan.md. Raya owns the renderer and
  artifact contracts; external tools are adapters. Use `uv` as the default
  Python runtime contract, Docker plus `uv` as the reference classroom path,
  and explicit execution/cache policies so normal rendering never reruns heavy
  or unsafe work by accident.

  Rich static rendering is the Phase 1 baseline: common Markdown, tables,
  displayed code, build-time MathJax math, callouts, footnotes, heading
  anchors, page tables of contents, escaped raw HTML, and generated browser
  support resources under `site/_raya/`. Accepted math uses inline `$...$`,
  display `$$` delimiter lines, MathJax `base`, `ams`, and `newcommand`,
  page-local macros, local `site/_raya/render/math/` CSS/fonts, strict
  diagnostics for malformed or unsupported math, browser checks for visible
  typesetting, and no external renderer asset requests. This baseline must
  remain static-first and must not execute code, notebooks, kernels, runtime
  profiles, package installers, Docker, or `uv`.

  Code and notebook references are the Phase 2 static baseline: Markdown links
  to `.py` and `.ipynb` files validate before build by extension and
  own-or-ancestor learning-quantum ownership, not by required folder names.
  Folder names such as `code/`, `notebooks/`, `scripts/`, `helpers/`, and
  `labs/` are ordinary author organization choices. Only validated linked
  files copy into `artifact/files/` and `artifact/site/_raya/files/`, write
  manifest-declared `data/references.json`, and record `not-executed` status.
  Cross-quantum reuse, execution, kernels, runtime profiles, cache refresh,
  trusted outputs, and browser execution require later accepted proposals.

  Runtime profile and cache metadata are the Phase 3 non-executing baseline:
  root `pyproject.toml`, `uv.lock`, and `runtime/profiles.yaml` live beside
  `course/`; `uv` is the default profile manager; Docker plus `uv` is recorded
  as reproducibility metadata; execution policies are explicit; generated
  `data/runtime.json`, `data/execution.json`, and `data/cache.json` describe
  profiles, plans, cache keys, and `not-executed` status. Validation, build,
  artifact inspection, and static serving must not call `uv`, Docker, kernels,
  scripts, notebooks, package installers, or cache refreshes.

  Local execution is the Phase 4 explicit-run baseline: `raya run <course>
  <target>` runs one validated script or notebook reference through the selected
  `uv` profile, optionally with Docker Compose plus `uv` when `--docker` is
  requested and profile metadata declares a service. `--dry-run` reports the
  plan without execution; `--refresh` reruns cache-policy targets. Generated
  logs, outputs, cache result records, and `data/execution-results.json` live
  under the artifact root and remain generated data, not course source truth.
  `never` refuses, `manual` runs only when selected, `cache` reuses valid
  generated cache records unless refreshed, `always` reruns only when selected,
  and `frozen` validates current reviewed output without executing. No proposal
  may make validation, build, artifact
  inspection, static serving, or rendered preview paths execute code by default.

  Reviewed output is the Phase 5 frozen-output baseline: source-controlled
  reviewed execution output lives under colocated `_reviewed/execution/`
  support, `raya outputs list <course>` reports generated/reviewed/frozen state
  without executing, and `raya outputs freeze <course> <target>` copies a
  current successful generated result into `_reviewed/` for human source review.
  Glintstone emits `data/reviewed-outputs.json`, copies reviewed files into
  `artifact/reviewed/` and `artifact/site/_raya/reviewed/`, and renders compact
  reviewed-output panels. Stale or missing reviewed output must fail validation
  and build before publication.

  Rendered surface discipline is the baseline for Glintstone pages: normal
  rendered pages are student-default views, support panels stay compact,
  static `_raya/inspect/` pages may expose audit details, and
  `manifest.json`, `data/*.json`, and copied files remain machine authority.
  Do not dump raw JSON, hashes, cache keys, source paths, artifact paths,
  browser storage paths, runtime internals, or reviewed-output freshness
  internals into the default reading flow.

  Rendered preview is the accepted local static review loop. `raya preview
  <course>` validates, builds, serves generated `artifact/site/`, and reports
  the student entrypoint plus `_raya/inspect/` URL when present. Preview must
  not execute scripts, notebooks, kernels, `raya run`, `raya outputs freeze`,
  Docker execution, package installers, runtime profiles, or cache refreshes.
  Rendered-surface proposals should include static-read-path and equivalent
  visual/layout checks for representative desktop and mobile-sized viewports.

  Legacy material is historical reference. Salvage principles intentionally,
  define new contracts, and test against current specs. Do not reintroduce old
  source names, renderer stacks, generated JSON shapes, examples, or workflow
  assumptions unless a current foundation decision or regenerated spec accepts
  them.

rules:
  proposal:
    - Reference the foundation files that justify the change.
    - Use canonical Raya Lucaria domain names when describing capabilities.
    - State the minimum requirement and the intended growth path.
    - Separate static-first contracts from optional dynamic domains.
    - Name legacy assumptions being salvaged or rejected.
    - Identify documentation impact for contributors/collaborators, professors, students, and agents, or state that no role-facing documentation update is needed.
    - Preserve convention-first source ordering and stable ID references when changes affect course content, navigation, generated indexes, graph data, or study objects.
    - Preserve `source: course`, ordered `course/` quanta, colocated `_official/`, colocated `_assets/`, and support-directory privacy when changes affect source-course structure.
    - Reference the rendering and execution phase plan when changes affect rich rendering, code, notebooks, runtimes, cache behavior, or executable examples.
    - Separate static code/notebook reference behavior from execution behavior when proposals touch scripts, notebooks, kernels, runtimes, cache, or outputs.
    - Keep runtime/cache proposals metadata-only unless the proposal explicitly opens local execution as a later phase.
    - Keep local execution target-scoped through `raya run <course> <target>` unless a future proposal explicitly defines a safe multi-target selector.
  specs:
    - Write testable requirements derived from foundation decisions.
    - Separate required baseline behavior from future or optional capabilities.
    - Preserve authority boundaries for official, personal, shared, generated, and accepted material.
    - Keep provider dependencies out of core contracts unless the provider is explicitly an adapter.
    - Require separate English and Spanish role-documentation directories with index pages when contributor/collaborator, professor, student, or agent documentation is created or updated.
    - Keep ordered source conventions, stable `raya:<id>` references, generated navigation data, and generated index data explicit when specs touch content ordering or rendering.
    - Keep `source: course` canonical and reject source `content:`, root authored `official/`, and root authored `assets/` unless a future accepted proposal explicitly reopens the contract.
    - Make execution policies, cache invalidation, runtime profiles, and static artifact outputs testable when specs touch executable content.
    - Require no-execution behavior for validation, build, artifact inspection, static serving, and rendered previews whenever local execution behavior changes.
    - Require preview CLI behavior, static serving, useful diagnostics, and no-execution guarantees when specs touch `raya preview` or rendered review workflows.
  design:
    - Map domain names to plain package boundaries when implementation structure matters.
    - Preserve static-only operation before adding backend, web UI, realtime, or agent features.
    - Show how new functionality can increase without invalidating current contracts.
    - Keep student work portable and exportable.
    - Keep English and Spanish role documentation in separate role directories while preserving English technical identifiers.
    - Treat generated navigation and index JSON as machine surfaces derived from source, not as hand-edited canonical source.
    - Keep support material colocated under the learning quantum it serves unless the design explicitly justifies a course-level/global source.
    - Treat execution results, logs, notebook outputs, and cache records as generated artifact data unless `raya outputs freeze` promotes selected current output into `_reviewed/` reviewed source support.
  tasks:
    - Start with schema, validation, fixture, CLI, and artifact contract tests when a change touches contracts.
    - Include real e2e/static-read-path tests when a change touches rendered HTML, browser-facing resources, deployment portability, or static site behavior.
    - Use representative fixture content for render/e2e tests; label it as fixture material and avoid letting examples become canonical pedagogy or architecture.
    - Keep examples minimal and labeled as fixtures, not pedagogy by accident.
    - Include documentation tasks for affected contributors/collaborators, professors, students, and agents.
    - Update separate English and Spanish role-documentation directories when role docs are created or changed, or explicitly track any deferred language directory/page.
    - Include documentation hygiene checks for current specs so `Purpose: TBD` placeholders do not remain after archive.
    - Keep rendered documentation fixtures separate from class/course examples and verify they use the static read path when rendered.
    - When live documentation changes, keep `docs/raya.yaml` and `docs/render-content/` aligned with `docs/foundation/` and `docs/guides/`, and verify `raya validate docs` or rendered-doc static-read-path coverage as appropriate.
    - Split dynamic domains into separate proposals after static contracts are stable.
    - Include ordered-content fixture and e2e coverage when source ordering, generated indexes, stable links, or static navigation changes.
    - Include unified-source fixture and e2e coverage when `source: course`, `_official/`, `_assets/`, or source-tree privacy changes.
    - Include examples, invalid fixtures, contract tests, e2e/static-read-path tests, role docs, and rendered-doc updates when rendering or executable-content workflows change.
    - Include MathJax adapter tests, invalid math fixtures, local math asset checks, Chromium visible-math checks, no-external-renderer-request assertions, desktop/mobile overflow checks, render-debug `report.json`/`index.html` artifacts and copied static-site parity, and `scripts/check-render-debug.sh` coverage when changes touch math rendering.
    - Include metadata-leakage assertions, static inspection coverage, and examples/gallery checks when rendered pages expose or hide generated artifact metadata.
    - Include preview command tests, static-read-path/e2e tests, and visual/layout checks when changes touch default page layout, support panels, examples/gallery, inspection pages, deployment portability, or preview behavior.
    - Include explicit `raya run` tests, cache reuse/refresh tests, notebook output tests, Docker command-shape coverage, and no-execution regressions when local execution changes.
    - Include `raya outputs list`, `raya outputs freeze`, reviewed-output schema, stale/missing reviewed-output diagnostics, frozen-policy validation, artifact inspection, and static-read-path tests when reviewed or frozen output behavior changes.
    - Include canonical script checks, stale current-guidance scans, generated-output scans, and known-missing-work updates when hygiene changes affect repository guidance or workflow boundaries.
